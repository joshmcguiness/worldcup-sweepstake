# Refresh + deploy schedule (betting era — NRL/AFL games run Thu–Sun):
#   Thu–Sun: 3x/day at 4pm, 7pm, 10pm AEST — around team lists, book locks and
#            pre-kickoff closing-price banking (CLV needs a fetch within ~12h
#            of kickoff, and games are Thu–Sun evenings).
#   Mon–Wed: once daily at 12pm AEST — settle the weekend, rate results.
# AEST = Brisbane, UTC+10, no DST, so UTC times/weekdays match AEST weekdays.
name: refresh
on:
  schedule:
    # Mon–Wed 12pm AEST (02:00 UTC; cron dow 1–3 = Mon–Wed)
    - cron: '0 2 * * 1,2,3'
    # Thu–Sun 4pm/7pm/10pm AEST (06:00/09:00/12:00 UTC; dow 4,5,6,0 = Thu–Sun)
    - cron: '0 6,9,12 * * 4,5,6,0'
  workflow_dispatch: {} # manual "Refresh now" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

# GitHub forces JS actions onto Node 24 from 16 Jun 2026 — mid-tournament.
# Opt in now so the transition is proven before the cron depends on it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test
      - name: Refresh data
        run: node build/refresh.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          REFRESH_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event_name == 'push' && 'deploy' || 'scheduled') }}
      - name: Commit data.json if changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
