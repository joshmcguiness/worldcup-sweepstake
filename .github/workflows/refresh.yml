# Refresh scores 4x/day and deploy the site to GitHub Pages.
# Times are 9am / 12pm / 3pm / 12am AEST (Brisbane, UTC+10, no DST). The 12am
# AEST run (14:00 UTC) is the daily rollover that freezes the new bet book,
# before any kickoff (~2am AEST earliest).
# The build job itself stops doing work after the final (date guard +
# all-104-scores check in build/refresh.js) — the workflow keeps firing
# harmlessly until the schedule is removed, and the last data.json stays live.
name: refresh
on:
  schedule:
    # AEST = UTC+10: 02:00→12pm, 05:00→3pm, 14:00→12am, 23:00→9am
    - cron: '0 2,5,14,23 * * *'
  workflow_dispatch: {} # manual "Refresh now" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

# GitHub forces JS actions onto Node 24 from 16 Jun 2026 — mid-tournament.
# Opt in now so the transition is proven before the cron depends on it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test
      - name: Refresh data
        run: node build/refresh.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          REFRESH_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event_name == 'push' && 'deploy' || 'scheduled') }}
      - name: Commit data.json if changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M')"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
